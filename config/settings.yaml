database_url: ${JOB_INTAKE_DATABASE_URL:-sqlite:///data/local/job_intake.db}
log_level: ${JOB_INTAKE_LOG_LEVEL:-INFO}
rules_path: rules.yaml
search_profiles_path: search_profiles.yaml
company_watchlist_path: company_watchlist.yaml
export_dir: data

crm:
  team_interview_goal: 4
  weekly_time_budget_hours: 10

# Source-grounded extraction and independent review, shared across all role profiles.
# AI is opt-in; deterministic parsing and evidence inspection work without a key.
annotation:
  enabled: true
  ai_enabled: false
  provider: gemini
  extract_model: gemini-2.5-flash-lite
  review_model: gemini-2.5-pro
  api_key_env: GEMINI_API_KEY
  cache_dir: data/local/annotations
  chunk_chars: 6000
  max_output_tokens: 4096
  request_timeout: 60
  max_retries: 2
  retry_backoff: 1

  # Mixed-provider example: equivalent to annotate --ai --preset budget-jev.
  # Replace existing model values below and uncomment other stage overrides.
  # AI remains opt-in; do not introduce duplicate YAML keys.
  # extract_provider: openai
  # extract_model: gpt-6-luna
  # extract_api_key_env: OPENAI_API_KEY
  # extract_reasoning_effort: none
  # review_provider: jev
  # review_model: jev-1.13.0
  # review_api_key_env: TYPESAFE_API_KEY
  # jev_min_probability: 0.95
  # jev_min_confidence: 0.8
  # jev_batch_size: 16
  # Custom Chat Completions endpoint requires an explicit HTTPS base URL:
  # extract_provider: openai_compatible
  # extract_base_url: https://gateway.example.com/v1
  # extract_api_key_env: CUSTOM_LLM_API_KEY
  # Never put API key values in this YAML.

telegram:
  enabled: false
  bot_token_env: TELEGRAM_BOT_TOKEN
  chat_id_env: TELEGRAM_CHAT_ID
  instant_a_tier: true
  daily_digest_enabled: true
  alert_dedup_hours: 24.0

llm:
  enabled: false
  provider: openai
  model: gpt-5-mini
  api_key_env: OPENAI_API_KEY
  prompt_path: config/llm_prompt.txt
  max_description_chars: 6000
  reasoning_effort: minimal
  max_output_tokens: 400
  request_timeout: 30.0
  semantic_score_min: -3.0
  semantic_score_max: 6.0
  strip_boilerplate: true
  skip_high_confidence: false
  high_confidence_margin: 4.0
  batch_enabled: false
  batch_completion_window: 24h
  batch_poll_interval: 30.0
  batch_max_wait: 86400.0

sources:
  - name: email-vacancies
    type: email_files
    enabled: false
    params:
      directory: data/local/job-emails
      max_messages: 100
  # Keep the existing source ID so re-fetching March history updates the same records.
  - name: dailyremote-bridge
    type: dailyremote
    enabled: true
    params:
      cookies_file: ${DAILYREMOTE_COOKIES_FILE}
      use_profile_queries: true
      search_url_template: https://dailyremote.com/remote-jobs?search={query}
      fetch_details: true
      max_detail_fetches: 40
      max_pages: 1
  - name: company-watchlist
    type: watchlist
    enabled: true
    params:
      watchlist_path: config/company_watchlist.yaml
  - name: generic-careers
    type: html
    enabled: false
    params:
      url: https://example.com/careers
      listing_selector: article.job-card
      title_selector: a.job-title
      company_selector: span.company-name
      apply_selector: a.job-title
      description_selector: p.job-summary
      location_selector: span.location
      employment_type_selector: span.employment-type
      salary_selector: span.salary
      timezone_selector: span.timezone
      job_id_attribute: data-job-id
