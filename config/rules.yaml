# Reviewed against career-orientation 2026-10-16; recognition corrections 2026-10-19.
# High-recall mode: unconfirmed scope stays REVIEW; explicit hiring blockers still reject.
recall_first: true
onsite_locations: [Sao Paulo, São Paulo]
required_languages: [English]
# The user manages projects and works with people; direct reports are optional.
# These are evidence proxies: title alone does not confirm day-to-day responsibilities.
required_scope_title_signals: [manager, head of, lead, director, chief, vice president]
required_scope_description_signals: [project management, project leadership, program management, program leadership, lead projects, lead analytics projects, lead analytical projects, lead cross-functional projects, manage projects, managing projects, manage analytics projects, cross-functional leadership, manage stakeholders, team leadership, people management, manage a team]
# Independently reviewed AI evidence must confirm actual responsibilities, not title alone.
# P&L/Finance and causal inference remain preferences; direct reports are optional.
required_annotation_focus: [project_management, people_interaction, decision_influence, working_english]
positive_title_signals: []
positive_description_signals: [pricing, monetization, experimentation, causal inference, causal impact, decision science, decision support, strategic decisions, business decisions, unit economics, p&l, profit and loss, general manager, finance business partner, budget planning, commercial strategy, marketplace economics]
negative_title_signals: [recruiting analytics, people analytics, security analytics]
negative_description_signals: [recruiting analytics, hr analytics, fraud detection only, reporting only, reports only, dashboard maintenance only, dashboards only, routine reporting only, only produce reports, solo analysis only, individual analysis only, without stakeholder interaction]
company_blacklist: []
company_whitelist: []
target_geographies: [Brazil, Brasil, BR, worldwide, global remote, Global, AMER, LATAM, Latin America, South America, Americas]
allowlist_phrases: [worldwide, globally remote, global remote, remote anywhere, work from anywhere, LATAM, Latin America, South America, Americas]
geography_blockers:
  - must be based in
  - must reside in
  - must live in
  - current residence in
  - us only
  - eu only
  - emea only
  - uk only
  - canada only
blocker_phrases:
  - us work authorization required
  - requires us work authorization
  - authorized to work in the u.s.
  - office in london required
  - hybrid in new york
timezone_allowed: [async, americas time zones, latam timezone]
timezone_blockers: []
review_phrases: [occasional travel, relocation required, overlap with est, overlap with pst, portuguese required]
closed_phrases: [no longer accepting applications, position has been filled, this job is closed]
